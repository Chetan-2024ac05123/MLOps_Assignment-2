name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 src/ api/ tests/ --max-line-length=120 --ignore=E501,W503

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create CI model
        run: |
          pip install -r requirements.txt
          mkdir -p models
          python -c "
          from src.train import build_cnn_model
          model = build_cnn_model()
          model.save('models/cats_dogs_cnn.h5')
          print('CI dummy model saved')
          "
      - name: Build Docker image
        run: docker build -t cats-dogs-api:latest .
      - name: Test container
        run: |
          docker run -d --name test-api -p 8000:8000 cats-dogs-api:latest
          sleep 15
          curl -f http://localhost:8000/health
          docker stop test-api && docker rm test-api
      - name: Push to Docker Hub
        if: github.event_name == 'push' && secrets.DOCKER_USERNAME != ''
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag cats-dogs-api:latest ${{ secrets.DOCKER_USERNAME }}/cats-dogs-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cats-dogs-api:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "Deployment triggered — apply k8s/ manifests to target cluster"
          echo "kubectl apply -f k8s/"
